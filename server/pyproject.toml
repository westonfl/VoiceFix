[project]
name = "rehear-analysis-server"
version = "0.1.0"
description = "Rehear Month 1 breath and resonance analysis server"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "librosa>=0.10.2",
  "numpy>=1.26.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "scipy>=1.13.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
